name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-windows:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GSTREAMER_VERSION: 1.22.12
      GSTREAMER_BASE: https://gstreamer.freedesktop.org/data/pkg/windows/1.22.12/msvc
      GSTREAMER_RUNTIME: gstreamer-1.0-msvc-x86_64-1.22.12.msi
      GSTREAMER_DEVEL: gstreamer-1.0-devel-msvc-x86_64-1.22.12.msi

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore GStreamer MSVC cache
        id: cache-gstreamer
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-${{ github.run_id }}
          restore-keys: |
            gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-

      - name: Validate GStreamer cache
        id: validate-gstreamer-cache
        shell: bash
        run: |
          set -euo pipefail
          runtime_ok=false
          devel_ok=false
          [ -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" ] && runtime_ok=true
          [ -f "D:/gstreamer/1.0/msvc_x86_64/lib/pkgconfig/gstreamer-1.0.pc" ] && devel_ok=true
          if [ "$runtime_ok" = true ] && [ "$devel_ok" = true ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cache validation: hit + runtime/devel verified"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Cache validation: miss or invalid cache layout (runtime_ok=$runtime_ok devel_ok=$devel_ok)"
          fi

      - name: Install GStreamer MSVC
        if: steps.validate-gstreamer-cache.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${GSTREAMER_BASE}"
          RUNTIME="${GSTREAMER_RUNTIME}"
          DEVEL="${GSTREAMER_DEVEL}"

          download_msi() {
            local file="$1"
            local msi_path="$RUNNER_TEMP/$file"
            echo "[download] $file"
            curl -L --retry 5 --retry-delay 10 --retry-max-time 300 \
              --connect-timeout 30 --max-time 300 --fail \
              -o "$msi_path" "$BASE/$file" || { echo "ERROR[download]: $file"; exit 11; }
            local size
            size="$(stat -c%s "$msi_path" 2>/dev/null || echo 0)"
            [ "$size" -gt 1000000 ] || { echo "ERROR[size]: $file is only $size bytes"; exit 12; }
            echo "[downloaded] $file ($size bytes)"
          }

          install_msi() {
            local file="$1"
            local msi_win_path
            msi_win_path="$(cygpath -w "$RUNNER_TEMP/$file")"
            local log_win_path
            log_win_path="$(cygpath -w "$RUNNER_TEMP/$file.install.log")"
            echo "[msiexec] installing $file"
            if ! msiexec //i "$msi_win_path" //qn //norestart //l*v "$log_win_path" INSTALLDIR=D:\\gstreamer; then
              echo "ERROR[msiexec-$file]: log=$log_win_path"
              exit 15
            fi
          }

          download_msi "$RUNTIME"
          download_msi "$DEVEL"
          install_msi "$RUNTIME"
          install_msi "$DEVEL"

          if [ ! -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" ]; then
            echo "ERROR[postinstall-verify]: gstreamer-1.0-0.dll missing"
            ls -la D:/gstreamer/ 2>/dev/null || true
            exit 16
          fi
          echo "GStreamer ${GSTREAMER_VERSION} installed and verified"

      - name: Verify GStreamer installation
        shell: bash
        run: |
          set -euo pipefail
          test -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" || { echo "ERROR[verify-env]: GStreamer runtime missing"; exit 17; }
          test -f "D:/gstreamer/1.0/msvc_x86_64/lib/pkgconfig/gstreamer-1.0.pc" || { echo "ERROR[verify-env]: GStreamer devel pkg-config file missing"; exit 18; }

      - name: Save GStreamer MSVC cache
        if: steps.validate-gstreamer-cache.outputs.valid != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-${{ github.run_id }}

      - name: Set GStreamer environment
        shell: pwsh
        run: |
          $gstPath = "D:\gstreamer\1.0\msvc_x86_64"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstPath" >> $env:GITHUB_ENV
          echo "$gstPath\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$gstPath\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run deterministic tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure -E "^FrameStaleMonitorTest\.BecomesStaleWhenFramesStop$"

      - name: Run flaky timing test (retry once)
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          $pattern = "^FrameStaleMonitorTest\.BecomesStaleWhenFramesStop$"
          ctest --test-dir build -C Release --output-on-failure -R $pattern
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Flaky timing test failed on first attempt; retrying once..."
            ctest --test-dir build -C Release --output-on-failure -R $pattern
            if ($LASTEXITCODE -ne 0) {
              throw "Flaky timing test failed on both attempts"
            }
          }
