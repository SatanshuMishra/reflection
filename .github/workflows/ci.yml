name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GStreamer MSVC
        shell: pwsh
        run: |
          $gstVer = "1.24.12"
          $baseUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/$gstVer"
          Invoke-WebRequest "$baseUrl/msvc/gstreamer-1.0-msvc-x86_64-$gstVer.msi" -OutFile gst-runtime.msi
          Invoke-WebRequest "$baseUrl/msvc/gstreamer-1.0-devel-msvc-x86_64-$gstVer.msi" -OutFile gst-devel.msi
          Start-Process msiexec -ArgumentList '/i gst-runtime.msi /quiet /norestart' -Wait
          Start-Process msiexec -ArgumentList '/i gst-devel.msi /quiet /norestart' -Wait

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $env:PKG_CONFIG_PATH = "C:\gstreamer\1.0\msvc_x86_64\lib\pkgconfig"
          $env:PATH = "C:\gstreamer\1.0\msvc_x86_64\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "C:\gstreamer\1.0\msvc_x86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "C:\gstreamer\1.0\msvc_x86_64\bin;$env:PATH"
          ctest --test-dir build --config Release --output-on-failure
