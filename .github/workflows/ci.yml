name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore GStreamer MSVC cache
        id: cache-gstreamer
        uses: actions/cache/restore@v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-1.22.12-d

      - name: Install GStreamer MSVC
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://gstreamer.freedesktop.org/data/pkg/windows/1.22.12/msvc/gstreamer-1.0-msvc-x86_64-1.22.12.msi"
          $msi = "$env:RUNNER_TEMP\gstreamer.msi"
          $devUrl = "https://gstreamer.freedesktop.org/data/pkg/windows/1.22.12/msvc/gstreamer-1.0-devel-msvc-x86_64-1.22.12.msi"
          $devMsi = "$env:RUNNER_TEMP\gstreamer-devel.msi"
          for ($i = 1; $i -le 5; $i++) {
            try {
              Write-Host "Download attempt $i/5..."
              Invoke-WebRequest -Uri $url -OutFile $msi -TimeoutSec 120
              Invoke-WebRequest -Uri $devUrl -OutFile $devMsi -TimeoutSec 120
              break
            } catch {
              Write-Warning "Attempt $i failed: $_"
              if ($i -eq 5) { throw "Failed to download GStreamer after 5 attempts" }
              Start-Sleep -Seconds (10 * $i)
            }
          }
          Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /qn INSTALLDIR=D:\gstreamer" -Wait -NoNewWindow
          Start-Process msiexec.exe -ArgumentList "/i `"$devMsi`" /qn INSTALLDIR=D:\gstreamer" -Wait -NoNewWindow

      - name: Save GStreamer MSVC cache
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-1.22.12-d

      - name: Set GStreamer environment
        shell: pwsh
        run: |
          $gstPath = "D:\gstreamer\1.0\msvc_x86_64"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstPath" >> $env:GITHUB_ENV
          echo "$gstPath\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$gstPath\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure -E "FrameStaleMonitorTest.BecomesStaleWhenFramesStop"
