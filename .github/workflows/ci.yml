name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore GStreamer MSVC cache
        id: cache-gstreamer
        uses: actions/cache/restore@v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-1.22.12-d

      - name: Install GStreamer MSVC
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        shell: bash
        run: |
          BASE="https://gstreamer.freedesktop.org/data/pkg/windows/1.22.12/msvc"
          RUNTIME="gstreamer-1.0-msvc-x86_64-1.22.12.msi"
          DEVEL="gstreamer-1.0-devel-msvc-x86_64-1.22.12.msi"
          for f in "$RUNTIME" "$DEVEL"; do
            echo "Downloading $f..."
            curl -L --retry 5 --retry-delay 10 --retry-max-time 300 \
                 --connect-timeout 30 --max-time 300 \
                 -o "$RUNNER_TEMP/$f" "$BASE/$f"
          done
          RUNTIME_PATH=$(cygpath -w "$RUNNER_TEMP/$RUNTIME")
          DEVEL_PATH=$(cygpath -w "$RUNNER_TEMP/$DEVEL")
          msiexec //i "$RUNTIME_PATH" //qn INSTALLDIR=D:\\gstreamer
          msiexec //i "$DEVEL_PATH" //qn INSTALLDIR=D:\\gstreamer

      - name: Save GStreamer MSVC cache
        if: steps.cache-gstreamer.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-1.22.12-d

      - name: Set GStreamer environment
        shell: pwsh
        run: |
          $gstPath = "D:\gstreamer\1.0\msvc_x86_64"
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstPath" >> $env:GITHUB_ENV
          echo "$gstPath\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$gstPath\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure -E "FrameStaleMonitorTest.BecomesStaleWhenFramesStop"
