name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---- macOS Build ----
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create app bundle
        run: |
          APP_DIR="Reflection.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp .build/release/Reflection "$APP_DIR/MacOS/Reflection"
          cp SupportingFiles/Info.plist "$APP_DIR/Info.plist"
          cp SupportingFiles/AppIcon.icns "$APP_DIR/Resources/AppIcon.icns"

          # Update version in Info.plist from tag
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$APP_DIR/Info.plist"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "SIGNING_IDENTITY=Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" >> "$GITHUB_ENV"

      - name: Sign app bundle
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID..."
            codesign --force --options runtime \
              --entitlements SupportingFiles/Reflection.entitlements \
              --sign "$SIGNING_IDENTITY" \
              Reflection.app
          else
            echo "No signing certificate configured. Using ad-hoc signature..."
            codesign --force --options runtime \
              --entitlements SupportingFiles/Reflection.entitlements \
              --sign - \
              Reflection.app
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R Reflection.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create -volname "Reflection" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            Reflection.dmg

          rm -rf dmg-staging

          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" Reflection.dmg
          fi

      - name: Notarize
        if: env.SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit Reflection.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple Reflection.dmg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: Reflection.dmg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  # ---- Windows Build ----
  build-windows:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GSTREAMER_VERSION: 1.22.12
      GSTREAMER_BASE: https://gstreamer.freedesktop.org/data/pkg/windows/1.22.12/msvc
      GSTREAMER_RUNTIME: gstreamer-1.0-msvc-x86_64-1.22.12.msi
      GSTREAMER_DEVEL: gstreamer-1.0-devel-msvc-x86_64-1.22.12.msi

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore GStreamer MSVC cache
        id: cache-gstreamer
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-${{ github.run_id }}
          restore-keys: |
            gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-

      - name: Validate GStreamer cache
        id: validate-gstreamer-cache
        shell: bash
        run: |
          set -euo pipefail
          runtime_ok=false
          devel_ok=false
          [ -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" ] && runtime_ok=true
          [ -f "D:/gstreamer/1.0/msvc_x86_64/lib/pkgconfig/gstreamer-1.0.pc" ] && devel_ok=true
          if [ "$runtime_ok" = true ] && [ "$devel_ok" = true ]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Cache validation: hit + runtime/devel verified"
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Cache validation: miss or invalid cache layout (runtime_ok=$runtime_ok devel_ok=$devel_ok)"
          fi

      - name: Disable Windows Defender real-time monitoring
        if: steps.validate-gstreamer-cache.outputs.valid != 'true'
        shell: pwsh
        run: |
          # Reduces I/O overhead during MSI extraction and file copying.
          # Common CI optimization (Electron, Chromium). Runner has limited attack surface.
          Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install GStreamer MSVC
        if: steps.validate-gstreamer-cache.outputs.valid != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${GSTREAMER_BASE}"
          RUNTIME="${GSTREAMER_RUNTIME}"
          DEVEL="${GSTREAMER_DEVEL}"

          download_msi() {
            local file="$1"
            local msi_path="$RUNNER_TEMP/$file"
            echo "[download] $file"
            curl -L --retry 5 --retry-delay 10 --retry-max-time 300 \
              --connect-timeout 30 --max-time 300 --fail \
              -o "$msi_path" "$BASE/$file" || { echo "ERROR[download]: $file"; exit 11; }
            local size
            size="$(stat -c%s "$msi_path" 2>/dev/null || echo 0)"
            [ "$size" -gt 1000000 ] || { echo "ERROR[size]: $file is only $size bytes"; exit 12; }
            echo "[downloaded] $file ($size bytes)"
          }

          install_msi() {
            local file="$1"
            local msi_win_path
            msi_win_path="$(cygpath -w "$RUNNER_TEMP/$file")"

            # Attempt 1: Administrative install (extract only — no VSS restore
            # point, no custom actions, no product registration). This bypasses
            # the msiexec /i hang caused by VSS on GitHub Actions Windows runners.
            echo "[msiexec /a] extracting $file"
            timeout 300 msiexec //a "$msi_win_path" //qn TARGETDIR=D:\\gstreamer && return 0
            local rc=$?
            echo "WARNING[msiexec-$file]: /a failed (rc=$rc)"

            # Attempt 2: Kill stale processes and retry /a
            if [ $rc -eq 124 ]; then
              echo "WARNING[msiexec-timeout]: killing stale msiexec processes"
              taskkill //F //IM msiexec.exe 2>/dev/null || true
              sleep 5
            fi
            echo "[msiexec /a] retry extracting $file"
            timeout 300 msiexec //a "$msi_win_path" //qn TARGETDIR=D:\\gstreamer && return 0
            rc=$?
            echo "WARNING[msiexec-$file]: /a retry failed (rc=$rc)"

            # Attempt 3: Fallback to lessmsi (pure extraction, no Windows
            # Installer service involvement at all)
            echo "[lessmsi] fallback extraction for $file"
            if ! command -v lessmsi &>/dev/null; then
              choco install lessmsi -y --no-progress
            fi
            local output_dir="D:/gstreamer-lessmsi-$$"
            mkdir -p "$output_dir"
            lessmsi x "$(cygpath -w "$RUNNER_TEMP/$file")" "$(cygpath -w "$output_dir")\\" || { echo "ERROR[lessmsi]: $file"; exit 15; }

            # lessmsi creates a SourceDir/ prefix — move contents to target
            if [ -d "$output_dir/SourceDir" ]; then
              cp -r "$output_dir/SourceDir/"* "D:/gstreamer/" 2>/dev/null || true
            else
              cp -r "$output_dir/"* "D:/gstreamer/" 2>/dev/null || true
            fi
            rm -rf "$output_dir"
            echo "[lessmsi] extraction complete for $file"
          }

          download_msi "$RUNTIME"
          download_msi "$DEVEL"
          install_msi "$RUNTIME"
          install_msi "$DEVEL"

          if [ ! -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" ]; then
            echo "ERROR[postinstall-verify]: gstreamer-1.0-0.dll missing"
            ls -la D:/gstreamer/ 2>/dev/null || true
            exit 16
          fi
          echo "GStreamer ${GSTREAMER_VERSION} installed and verified"

      - name: Verify GStreamer installation
        shell: bash
        run: |
          set -euo pipefail
          test -f "D:/gstreamer/1.0/msvc_x86_64/bin/gstreamer-1.0-0.dll" || { echo "ERROR[verify-env]: GStreamer runtime missing"; exit 17; }
          test -f "D:/gstreamer/1.0/msvc_x86_64/lib/pkgconfig/gstreamer-1.0.pc" || { echo "ERROR[verify-env]: GStreamer devel pkg-config file missing"; exit 18; }

      - name: Save GStreamer MSVC cache
        if: steps.validate-gstreamer-cache.outputs.valid != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: D:\gstreamer
          key: gstreamer-msvc-${{ env.GSTREAMER_VERSION }}-v2-${{ github.run_id }}

      - name: Set GStreamer environment
        shell: pwsh
        run: |
          $gstPath = "D:\gstreamer\1.0\msvc_x86_64"
          [System.Environment]::SetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", $gstPath, "Process")
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstPath" >> $env:GITHUB_ENV
          echo "$gstPath\bin" >> $env:GITHUB_PATH
          echo "PKG_CONFIG_PATH=$gstPath\lib\pkgconfig" >> $env:GITHUB_ENV

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@5e0cab206a5ea620130caf672fce3e4a6b5666a1 # v11.5
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run deterministic tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure -E "^FrameStaleMonitorTest\.BecomesStaleWhenFramesStop$"

      - name: Run flaky timing test (retry once)
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          $pattern = "^FrameStaleMonitorTest\.BecomesStaleWhenFramesStop$"
          ctest --test-dir build -C Release --output-on-failure -R $pattern
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Flaky timing test failed on first attempt; retrying once..."
            ctest --test-dir build -C Release --output-on-failure -R $pattern
            if ($LASTEXITCODE -ne 0) {
              throw "Flaky timing test failed on both attempts"
            }
          }

      - name: Bundle GStreamer runtime
        # Safety net: CMake post-build already runs this script, but MSBuild
        # may silently swallow non-zero exits from PowerShell post-build
        # commands. This explicit step guarantees a hard CI failure if any
        # required DLL or plugin is missing.
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          .\scripts\bundle-gstreamer.ps1 `
            -ExePath "build\Release\Reflection.exe" `
            -SearchDirs "$gstRoot\bin" `
            -OutputDir "build\Release" `
            -PluginSrcDir "$gstRoot\lib\gstreamer-1.0" `
            -PluginOutputDir "build\Release\plugins"

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $staging = "Reflection-x64"
          New-Item -ItemType Directory -Path $staging -Force
          if (-not (Test-Path "build/Release/Reflection.exe")) {
            Write-Error "Missing required executable: build/Release/Reflection.exe"
            exit 1
          }
          Copy-Item "build/Release/Reflection.exe" "$staging/"
          # Copy co-located DLLs
          Get-ChildItem "build/Release/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging/"
          # Copy bundled GStreamer plugins
          if (Test-Path "build/Release/plugins") {
              Copy-Item "build/Release/plugins" "$staging/plugins" -Recurse
          } else {
              Write-Error "Missing required plugin directory: build/Release/plugins"
              exit 1
          }
          # Copy UI assets
          if (Test-Path "build/Release/assets") {
              Copy-Item "build/Release/assets" "$staging/assets" -Recurse
          }
          # Include cleanup script for portable uninstall
          if (Test-Path "installer/cleanup.bat") {
              Copy-Item "installer/cleanup.bat" "$staging/"
          }
          $zipPath = "Reflection-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath $zipPath
          if (-not (Test-Path $zipPath)) {
            Write-Error "Expected ZIP artifact missing: $zipPath"
            exit 1
          }

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@b8e8eb5936437c243592fda645c96dfc6488c275 # v1.2.2
        with:
          path: windows/installer/reflection.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - name: Validate Windows release artifacts
        shell: pwsh
        run: |
          $zip = "Reflection-${{ steps.version.outputs.version }}-windows-x64.zip"
          if (-not (Test-Path $zip)) {
            Write-Error "Portable ZIP missing: $zip"
            exit 1
          }
          $installer = Get-ChildItem "installer/Output/Reflection-*-Setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            Write-Error "Installer artifact missing under installer/Output"
            exit 1
          }
          Write-Host "Validated artifacts: $zip and $($installer.Name)"

      - name: Download winsparkle-tool for Ed25519 signing
        shell: pwsh
        run: |
          $url = "https://github.com/vslavik/winsparkle/releases/download/v0.9.2/WinSparkle-0.9.2.zip"
          Invoke-WebRequest -Uri $url -OutFile WinSparkle-dist.zip
          Expand-Archive -Path WinSparkle-dist.zip -DestinationPath WinSparkle-dist

      - name: Sign installer and generate appcast
        if: ${{ env.WINSPARKLE_EDDSA_PRIVATE_KEY != '' }}
        shell: pwsh
        env:
          WINSPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.WINSPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          # Write private key to temp file (deleted immediately after use)
          $keyFile = [System.IO.Path]::GetTempFileName()
          try {
              [System.IO.File]::WriteAllText($keyFile, $env:WINSPARKLE_EDDSA_PRIVATE_KEY)

              $installer = Get-ChildItem "installer/Output/Reflection-*-Setup.exe" | Select-Object -First 1
              $toolPath = Get-ChildItem "WinSparkle-dist/WinSparkle-*/bin/winsparkle-tool.exe" | Select-Object -First 1

              .\scripts\generate-appcast.ps1 `
                  -Version "${{ steps.version.outputs.version }}" `
                  -InstallerPath $installer.FullName `
                  -PrivateKeyPath $keyFile `
                  -WinSparkleToolPath $toolPath.FullName `
                  -OutputPath "appcast.xml" `
                  -RepoUrl "https://github.com/SatanshuMishra/reflection"
          } finally {
              Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            windows/Reflection-*.zip
            windows/installer/Output/Reflection-*-Setup.exe
            windows/appcast.xml

  # ---- Create Unified Release ----
  # Runs if at least macOS succeeds — allows macOS-only releases when
  # Windows build fails (e.g., GStreamer installation timeout).
  create-release:
    needs: [build-macos, build-windows]
    if: always() && needs.build-macos.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          name: "Reflection ${{ github.ref_name }}"
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---- Deploy Auto-Update Appcast to GitHub Pages ----
  deploy-appcast:
    needs: [build-windows, create-release]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success'
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-windows
          path: artifacts

      - name: Prepare appcast for GitHub Pages
        run: |
          mkdir -p pages
          if [ -f artifacts/windows/appcast.xml ]; then
            cp artifacts/windows/appcast.xml pages/
            echo "Appcast found and staged for deployment"
          else
            echo "No appcast.xml found -- skipping deployment"
            exit 0
          fi

      - name: Deploy appcast to GitHub Pages
        if: ${{ hashFiles('pages/appcast.xml') != '' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          keep_files: true
