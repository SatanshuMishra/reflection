name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---- macOS Build ----
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Run tests
        run: swift test

      - name: Build release
        run: swift build -c release

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create app bundle
        run: |
          APP_DIR="Reflection.app/Contents"
          mkdir -p "$APP_DIR/MacOS"
          mkdir -p "$APP_DIR/Resources"

          cp .build/release/Reflection "$APP_DIR/MacOS/Reflection"
          cp SupportingFiles/Info.plist "$APP_DIR/Info.plist"
          cp SupportingFiles/AppIcon.icns "$APP_DIR/Resources/AppIcon.icns"

          # Update version in Info.plist from tag
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$APP_DIR/Info.plist"

      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "SIGNING_IDENTITY=Developer ID Application: ${{ secrets.APPLE_TEAM_NAME }}" >> "$GITHUB_ENV"

      - name: Sign app bundle
        run: |
          if [ -n "$SIGNING_IDENTITY" ]; then
            echo "Signing with Developer ID..."
            codesign --force --options runtime \
              --entitlements SupportingFiles/Reflection.entitlements \
              --sign "$SIGNING_IDENTITY" \
              Reflection.app
          else
            echo "No signing certificate configured. Using ad-hoc signature..."
            codesign --force --options runtime \
              --entitlements SupportingFiles/Reflection.entitlements \
              --sign - \
              Reflection.app
          fi

      - name: Create DMG
        run: |
          mkdir -p dmg-staging
          cp -R Reflection.app dmg-staging/
          ln -s /Applications dmg-staging/Applications

          hdiutil create -volname "Reflection" \
            -srcfolder dmg-staging \
            -ov -format UDZO \
            Reflection.dmg

          rm -rf dmg-staging

          if [ -n "$SIGNING_IDENTITY" ]; then
            codesign --force --sign "$SIGNING_IDENTITY" Reflection.dmg
          fi

      - name: Notarize
        if: env.SIGNING_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool submit Reflection.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple Reflection.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Reflection.dmg

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

  # ---- Windows Build ----
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install GStreamer MSVC
        uses: blinemedical/setup-gstreamer@v1
        with:
          version: '1.22.7'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgJsonGlob: 'windows/vcpkg.json'
        env:
          VCPKG_BINARY_SOURCES: 'clear;default,readwrite'

      - name: Configure CMake
        shell: pwsh
        run: |
          $gstRoot = $env:GSTREAMER_1_0_ROOT_MSVC_X86_64
          $env:PKG_CONFIG_PATH = "$gstRoot\lib\pkgconfig"
          $env:PATH = "$gstRoot\bin;$env:PATH"
          cmake -B build `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          cmake --build build --config Release

      - name: Run tests
        shell: pwsh
        run: |
          $env:PATH = "$env:GSTREAMER_1_0_ROOT_MSVC_X86_64\bin;$env:PATH"
          ctest --test-dir build --config Release --output-on-failure

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $staging = "Reflection-x64"
          New-Item -ItemType Directory -Path $staging -Force
          Copy-Item "build/Release/Reflection.exe" "$staging/"
          # Copy co-located DLLs
          Get-ChildItem "build/Release/*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$staging/"
          # Copy bundled GStreamer plugins
          if (Test-Path "build/Release/plugins") {
              Copy-Item "build/Release/plugins" "$staging/plugins" -Recurse
          }
          # Copy UI assets
          if (Test-Path "build/Release/assets") {
              Copy-Item "build/Release/assets" "$staging/assets" -Recurse
          }
          Compress-Archive -Path "$staging/*" -DestinationPath "Reflection-${{ steps.version.outputs.version }}-windows-x64.zip"

      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/installer/reflection.iss
          options: /DAppVersion=${{ steps.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            windows/Reflection-*.zip
            windows/installer/Output/Reflection-*-Setup.exe

  # ---- Create Unified Release ----
  create-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          name: "Reflection ${{ github.ref_name }}"
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
