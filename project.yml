name: Reflection
options:
  bundleIdPrefix: com.reflection
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "17.0"
  minimumXcodeGenVersion: "2.40"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_DEBUG_DYLIB: YES

targets:
  Reflection:
    type: application
    platform: macOS
    sources:
      - path: Sources/Reflection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reflection.app
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/Reflection.entitlements
        ENABLE_DEBUG_DYLIB: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: SupportingFiles/Info.plist
